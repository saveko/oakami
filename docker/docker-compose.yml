version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: oakami-db
    environment:
      POSTGRES_USER: oakami
      POSTGRES_PASSWORD: oakami_password
      POSTGRES_DB: oakami_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U oakami']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oakami-network

  redis:
    image: redis:7-alpine
    container_name: oakami-cache
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oakami-network

volumes:
  postgres_data:
  redis_data:

networks:
  oakami-network:
    driver: bridge
